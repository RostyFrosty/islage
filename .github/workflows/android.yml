name: Bygg Android-app

# Bygger en APK med Capacitor. Appen laddar islage.geapanenbanan.com, så den är alltid lika
# ny som sajten – ett nytt bygge behövs bara när själva skalet (namn, ikon, inställningar) ändras.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['capacitor.config.json', '.github/workflows/android.yml', 'site/icons/**']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }

      - name: Capacitor
        run: |
          npm install --no-save @capacitor/cli@7 @capacitor/core@7 @capacitor/android@7
          npx cap add android

      - name: Ikoner
        run: |
          command -v convert >/dev/null || (sudo apt-get update -q && sudo apt-get install -yq imagemagick)
          cd android/app/src/main/res
          rm -rf mipmap-anydpi-v26
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            dir=mipmap-${d%%:*}; px=${d##*:}
            convert ../../../../../site/icons/icon-512.png -resize ${px}x${px} $dir/ic_launcher.png
            cp $dir/ic_launcher.png $dir/ic_launcher_round.png
            rm -f $dir/ic_launcher_foreground.png
          done

      - name: Bygg APK
        run: |
          npx cap sync android
          cd android && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../islage.apk

      - uses: actions/upload-artifact@v4
        with: { name: islage-apk, path: islage.apk }

      - name: Lägg upp som nedladdning
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release view android >/dev/null 2>&1 || gh release create android --prerelease --title "Isläge för Android" --notes "Installera islage.apk på telefonen (tillåt installation från okända källor)."
          gh release upload android islage.apk --clobber
