name: Uppdatera seriekatalog

on:
  schedule:
    - cron: '15 3 * * 1,4'   # måndag + torsdag 04:15 svensk vintertid – nya serier och lag dyker upp löpande
  workflow_dispatch:
    inputs:
      full:
        description: 'Bygg om hela katalogen (ny säsong)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-data      # krockar inte med data-jobbet
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Sök serier
        run: node scripts/catalog.mjs ${{ inputs.full && '--full' || '' }}
      - name: Spara
        run: |
          git config user.name  "islage-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data/catalog.json site/data/teams.json 2>/dev/null || git add site/data/catalog.json
          git diff --cached --quiet || git commit -m "Katalog $(date -u +'%Y-%m-%d')"
          git pull --rebase && git push
