<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Isläge – svensk hockey live</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Isläge">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1220; --bg2:#111a2c; --card:#152036; --card2:#1b2942; --line:#24324d;
  --text:#eef3fb; --muted:#8b9ab4; --dim:#5d6c87;
  --ice:#7cc4ff; --live:#ff3b4e; --win:#3ddc97; --gold:#ffc94d;
  --r:16px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:15px}
body{min-height:100vh;padding-bottom:calc(76px + var(--safe-b))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.num{font-family:"Barlow Condensed",Inter,sans-serif;font-variant-numeric:tabular-nums}

/* Header */
header.top{position:sticky;top:0;z-index:20;padding:calc(12px + var(--safe-t)) 16px 10px;
  background:linear-gradient(var(--bg) 70%,rgba(11,18,32,.85));backdrop-filter:blur(10px)}
.toprow{display:flex;align-items:center;gap:10px}
.back{width:36px;height:36px;border-radius:12px;background:var(--card);display:grid;place-items:center}
.brand{font-family:"Barlow Condensed";font-weight:800;font-size:26px;letter-spacing:.5px;flex:1}
.brand span{color:var(--ice)}
.brand .studio{display:block;font-family:Inter,sans-serif;font-size:12px;font-weight:500;letter-spacing:.3px;color:var(--muted);margin-top:-1px}
.brand .studio b{color:var(--text);font-weight:700}
.demo{font-size:11px;font-weight:600;color:var(--gold);border:1px solid rgba(255,201,77,.35);padding:3px 8px;border-radius:99px}

/* Date strip */
.dates{display:flex;gap:6px;overflow-x:auto;padding:10px 16px 4px;scrollbar-width:none}
.dates::-webkit-scrollbar{display:none}
.date{flex:0 0 auto;min-width:54px;padding:8px 6px;border-radius:12px;background:var(--card);text-align:center;color:var(--muted)}
.date b{display:block;font-family:"Barlow Condensed";font-size:20px;color:var(--text)}
.date small{font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.date.on{background:var(--ice);color:#06223a}.date.on b{color:#06223a}

main{padding:6px 16px 20px;max-width:640px;margin:0 auto}
h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:22px 4px 10px;display:flex;align-items:center;gap:8px}
h2.sec .pill{margin-left:auto}

/* Chips */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:4px -16px 0;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 14px;border-radius:99px;background:var(--card);color:var(--muted);font-weight:600;font-size:13px}
.chip.on{background:var(--text);color:var(--bg)}

/* Game card */
.card{background:var(--card);border-radius:var(--r);overflow:hidden}
.games{display:flex;flex-direction:column;gap:8px}
.game{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px 16px;background:var(--card);border-radius:var(--r);text-align:left;width:100%;position:relative}
.game:active{transform:scale(.99);background:var(--card2)}
.game.live{box-shadow:inset 3px 0 0 var(--live)}
.team{display:flex;align-items:center;gap:10px;font-weight:600;min-width:0}
.team .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team.lose{color:var(--muted);font-weight:500}
.score{font-family:"Barlow Condensed";font-weight:700;font-size:22px;text-align:right;line-height:1}
.score.lose{color:var(--muted)}
.meta{grid-column:1/-1;display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin-top:4px}
.meta .per{margin-left:auto;font-family:"Barlow Condensed";font-size:14px;letter-spacing:.3px}
.badge{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-family:"Barlow Condensed";font-weight:800;font-size:12px;flex:0 0 auto;color:#fff;letter-spacing:.3px}
.badge.lg{width:58px;height:58px;border-radius:18px;font-size:20px}
.livetag{display:inline-flex;align-items:center;gap:5px;color:var(--live);font-weight:700;font-size:12px}
.livetag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--live);animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,59,78,.7)}70%{box-shadow:0 0 0 7px rgba(255,59,78,0)}100%{box-shadow:0 0 0 0 rgba(255,59,78,0)}}
.pill{font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--card2);color:var(--muted)}
.star{position:absolute;right:10px;top:8px;font-size:12px;color:var(--gold)}

/* League list */
.league{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--card);border-radius:var(--r);width:100%;text-align:left}
.league + .league{margin-top:8px}
.league .ic{width:40px;height:40px;border-radius:12px;background:var(--card2);display:grid;place-items:center;font-family:"Barlow Condensed";font-weight:800;color:var(--ice)}
.league .t{flex:1}.league .t b{display:block}.league .t small{color:var(--muted)}
.chev{color:var(--dim)}

.search input,.select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
.search input:focus,.select:focus{border-color:var(--ice)}
.select{margin-top:8px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.sfav{font-size:20px;color:var(--dim);padding:4px 2px 4px 8px}.sfav.on{color:var(--gold)}
.tv{font-size:11px;font-weight:700;color:#fff;background:#6d3df5;padding:2px 7px;border-radius:6px;margin-left:6px}
.watch{display:block;margin:14px auto 0;padding:13px 16px;border-radius:14px;background:#6d3df5;color:#fff;font-weight:700;text-decoration:none;font-size:15px}
.watch.live{background:linear-gradient(90deg,#ff3b4e,#6d3df5)}
.sechead{display:flex;align-items:center;gap:8px;width:100%;text-align:left;margin:22px 0 10px;padding:0 4px}
.sechead b{display:block;font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.sechead small{color:var(--dim);font-size:12px}.sechead span:first-child{flex:1}
.todaylist .trow{display:flex;align-items:center;gap:10px;width:100%;padding:12px 16px;text-align:left}
.todaylist .trow + .trow{border-top:1px solid var(--line)}
.trow .tn{flex:1;min-width:0}.trow .tn b{font-weight:600;display:block}.trow .tn small{color:var(--muted);font-size:12px}
.trow .cnt{font-family:"Barlow Condensed";font-size:17px;color:var(--muted);min-width:18px;text-align:right}
.tstar{font-size:15px;color:var(--dim);padding:0 2px}.tstar.on{color:var(--gold)}
.live-pill{color:var(--live)!important}
.lgrp + .lgrp{border-top:1px solid var(--line)}
.lp{display:flex;align-items:center;gap:12px;padding:9px 16px;font-size:14px}
.lp .no{width:26px;text-align:right;color:var(--muted);font-family:"Barlow Condensed";font-size:16px}
.lp small{margin-left:auto;color:var(--dim);font-size:11px}
.lsub{padding:6px 16px 0;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px}
.chip .badge{width:18px;height:18px;font-size:9px;border-radius:5px;display:inline-grid;vertical-align:-4px;margin-right:4px}
.favhead{display:flex;align-items:center;gap:10px;margin:8px 0;padding:12px;border-radius:16px;background:var(--card);cursor:pointer;width:100%;text-align:left}
.favhead .fchev{color:var(--dim);transition:transform .2s;font-size:18px}.favhead.open .fchev{transform:rotate(90deg)}
.favhead .fnext{color:var(--muted);font-size:12px;white-space:nowrap}
.favgames{margin:0 0 14px}.favgames[hidden]{display:none}
.chips.tf{position:sticky;top:var(--hdrh,58px);z-index:15;background:var(--bg);margin-top:4px;padding-top:8px;padding-bottom:8px}
.favhead .fn{flex:1;min-width:0}.favhead .fn b{display:block;font-size:15px}.favhead .fn small{color:var(--muted);font-size:12px}
.ver{color:var(--dim);font-size:11px;text-align:center;margin:28px 0 8px}
/* Tabs */
.tabs{display:flex;background:var(--card);border-radius:12px;padding:4px;margin:14px 0}
.tabs button{flex:1;padding:9px 0;border-radius:9px;font-weight:600;font-size:13px;color:var(--muted)}
.tabs button.on{background:var(--card2);color:var(--text)}

/* Table */
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;color:var(--dim);font-weight:600;text-transform:uppercase;padding:10px 4px;text-align:center}
td{padding:9px 4px;text-align:center;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
td.tm,th.tm{text-align:left}
td.tm div{display:flex;align-items:center;gap:8px;font-weight:600}
td.tm .badge{width:22px;height:22px;font-size:10px;border-radius:7px}
td.rk{color:var(--muted);width:24px}
td.pts{font-weight:700}
tr.cut td{border-top:2px dashed var(--dim)}
tr.fav td{background:rgba(124,196,255,.07)}

/* Game detail */
.hero{background:radial-gradient(120% 100% at 50% 0%,#1d3157 0%,var(--card) 70%);border-radius:22px;padding:18px 16px 16px;text-align:center}
.hero .lg{font-size:12px;color:var(--muted);margin-bottom:12px}
.hero .row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.hero .side{display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:600;font-size:14px}
.hero .big{font-family:"Barlow Condensed";font-weight:800;font-size:56px;line-height:1;letter-spacing:1px}
.hero .status{margin-top:6px;font-size:13px;color:var(--muted)}
.hero .pers{margin-top:12px;display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.hero .pers span{font-family:"Barlow Condensed";font-size:15px;background:rgba(255,255,255,.06);padding:3px 9px;border-radius:8px;color:var(--muted)}
.hero .pers span.cur{color:var(--text);background:rgba(255,59,78,.18)}
.favbtn{margin-top:12px;font-size:12px;color:var(--muted);padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.06)}

.statrow{padding:12px 16px}
.statrow + .statrow{border-top:1px solid var(--line)}
.statrow .lbl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
.statrow .lbl span:nth-child(2){color:var(--muted)}
.bar{display:flex;height:6px;border-radius:6px;overflow:hidden;gap:3px}
.bar i{display:block;border-radius:6px}

/* Timeline */
.tl{padding:4px 0}
.ev{display:grid;grid-template-columns:48px 1fr;gap:10px;padding:12px 16px;align-items:start}
.ev + .ev{border-top:1px solid var(--line)}
.ev .tm{font-family:"Barlow Condensed";font-size:17px;color:var(--muted);padding-top:1px}
.ev .body{display:flex;gap:10px;align-items:flex-start}
.ev .ico{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:13px;flex:0 0 auto}
.ev.goal .ico{background:rgba(61,220,151,.15);color:var(--win)}
.ev.pen .ico{background:rgba(255,201,77,.13);color:var(--gold)}
.ev.gk .ico{background:rgba(124,196,255,.12);color:var(--ice)}
.ev b{display:block;font-size:14px}
.ev small{color:var(--muted);font-size:12px}
.ev .sc{white-space:nowrap;margin-left:auto;font-family:"Barlow Condensed";font-weight:700;font-size:18px}
.ev.new{animation:flash 2s}
@keyframes flash{0%{background:rgba(61,220,151,.25)}100%{background:transparent}}
.perhead{padding:10px 16px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);background:var(--bg2)}

.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty .big{font-size:36px;margin-bottom:8px}

/* Bottom nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;
  padding:8px 8px calc(8px + var(--safe-b));background:rgba(17,26,44,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
nav.bottom button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--dim);padding:4px 0}
nav.bottom button.on{color:var(--ice)}
nav.bottom svg{width:22px;height:22px}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--win);color:#032b1b;font-weight:700;padding:10px 16px;border-radius:12px;transition:.3s;z-index:40;font-size:14px;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>

<main id="app"></main>
<nav class="bottom" id="nav">

</nav>

/* påhittade händelser till matchdetaljer */
function demoDetail(game){
  const ev=[]; let h=0,a=0; const names=['Andersson','Berg','Carlsson','Dahl','Ek','Forsberg','Holm','Lund','Nilsson','Strand','Wikström'];
  const nm=()=>names[Math.floor(Math.random()*names.length)][0]+'. '+names[Math.floor(Math.random()*names.length)];
  game.periods.forEach((p,pi)=>{
    const goals=[...Array(p[0]).fill(game.home),...Array(p[1]).fill(game.away)].map(t=>({t,s:Math.floor(Math.random()*1190)+5}));
    const pens=[...Array(1+Math.floor(Math.random()*2))].map(()=>({t:Math.random()<.5?game.home:game.away,s:Math.floor(Math.random()*1190)+5,pen:true}));
    [...goals,...pens].sort((x,y)=>x.s-y.s).forEach(e=>{
      const clock=fmtClock(pi*1200+e.s);
      if(e.pen) ev.push({period:pi+1,time:clock,type:'pen',team:e.t,title:'Utvisning 2 min',text:nm()+' · '+['Hakning','Slashing','Interference','Crosschecking'][Math.floor(Math.random()*4)]});
      else { e.t===game.home?h++:a++; ev.push({period:pi+1,time:clock,type:'goal',team:e.t,title:'Mål – '+nm(),text:'Assist: '+nm()+', '+nm()+(Math.random()<.3?' · PP1':''),score:h+'–'+a}); }
    });
  });
  const sh=game.periods.map(p=>[p[0]*3+5+Math.floor(Math.random()*6), p[1]*3+5+Math.floor(Math.random()*6)]);
  return {events:ev, shots:sh, pim:[ev.filter(e=>e.type==='pen'&&e.team===game.home).length*2, ev.filter(e=>e.type==='pen'&&e.team===game.away).length*2],
    goalies:[{team:game.home,name:'M. Ek',sv:(sh.reduce((s,x)=>s+x[1],0)-game.as),sa:sh.reduce((s,x)=>s+x[1],0)},{team:game.away,name:'J. Holm',sv:(sh.reduce((s,x)=>s+x[0],0)-game.hs),sa:sh.reduce((s,x)=>s+x[0],0)}]};
}
const fmtClock = s => String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');

/* Simulerad livematch: klockan går 20x fortare och händelser dyker upp */
const SIM = {sec:2*1200+312, detail:null};
function simTick(){
  const gm = DEMO.games.find(x=>x.id==='live1'); if(gm.status!=='live') return;
  if(!SIM.detail){ SIM.detail = demoDetail(gm); }
  SIM.sec += 20;
  const per = Math.floor(SIM.sec/1200)+1;
  while(gm.periods.length<per) gm.periods.push([0,0]);
  if(SIM.sec>=3600){ gm.status='final'; gm.clock=null; render(); return; }
  gm.clock = `P${per} · ${fmtClock(SIM.sec)}`;
  if(Math.random()<.035){
    const home=Math.random()<.5, team=home?gm.home:gm.away;
    home?gm.hs++:gm.as++; gm.periods[per-1][home?0:1]++;
    SIM.detail.events.push({period:per,time:fmtClock(SIM.sec),type:'goal',team,title:'Mål – '+['E. Strand','O. Lund','K. Berg'][Math.floor(Math.random()*3)],text:'Assist: M. Dahl',score:gm.hs+'–'+gm.as,fresh:true});
    toast(`MÅL! ${abbr(team)} · ${gm.hs}–${gm.as}`);
  } else if(Math.random()<.03){
    SIM.detail.events.push({period:per,time:fmtClock(SIM.sec),type:'pen',team:Math.random()<.5?gm.home:gm.away,title:'Utvisning 2 min',text:'Hakning',fresh:true});
  }
  if(SIM.detail.shots.length<per) SIM.detail.shots.push([0,0]);
  if(Math.random()<.25) SIM.detail.shots[per-1][Math.random()<.5?0:1]++;
  if(route.view==='today'||route.view==='favs'||(route.view==='game'&&route.id==='live1')||(route.view==='league'&&route.id==='20962'&&leagueTab!=='table')) render(true);
}

/* påhittad tabell för demo-ungdomsserier (stabil per serie-ID) */
function demoYouthTable(lg){
  let seed=+lg.id; const rnd=()=>((seed=(seed*9301+49297)%233280)/233280);
  const clubs=(DEMO_CLUBS[lg.district]||DEMO_CLUBS['Småland']).map(c=>c+(/2|Röd|Vit|B$/.test(lg.name)?' 2':''));
  return clubs.map(team=>{const gp=8+Math.floor(rnd()*4),w=Math.floor(rnd()*gp),t=Math.floor(rnd()*(gp-w)),l=gp-w-t,gf=w*4+t*2+Math.floor(rnd()*10),ga=l*4+t*2+Math.floor(rnd()*10);
    return {team,gp,w,t,l,otw:0,otl:0,gf,ga,tp:w*3+t};}).sort((a,b)=>b.tp-a.tp||(b.gf-b.ga)-(a.gf-a.ga));
}

/* =========================================================
   STATE + FAVORITER
   ========================================================= */
/* Favoritlag = lagnamn + åldersklass (t.ex. Nacka HK i U15 pojkar). Laget följs i alla serier i den
   klassen där det spelar: grundserie, fortsättningsserie, DM – och nya serier när de dyker upp.
   lid = serien där laget stjärnmärktes (reserv om serien saknas i katalogen). */
let favs = [];   /* [{team, cls, lid}] */
try{ favs = JSON.parse(localStorage.getItem('isl-favs')||'[]'); }catch(e){}
try{ /* äldre format: ['Lagnamn'] + {lag: serie-ID} */
  const old = JSON.parse(localStorage.getItem('isl-favleague')||'{}');
  favs = favs.map(f => typeof f==='string' ? {team:f, lid:old[f]||''} : f);
}catch(e){}
const saveFavs=()=>{ try{ localStorage.setItem('isl-favs',JSON.stringify(favs)); localStorage.removeItem('isl-favleague'); }catch(e){} };
/* åldersklass för en serie, t.ex. "15P", "S-H" (senior herr), "S-F" (dam) */
const clsOf = lid => { const m = CATALOG && lid && CATALOG.find(c=>c.id===lid); return m ? (m.age ? `${m.age}${m.gender}` : `S-${m.gender==='F'?'F':'H'}`) : null; };
const clsLabel = c => !c ? '' : c.startsWith('S-') ? (c==='S-F'?'Dam':'Herr') : `U${parseInt(c)} ${genderLabel[c.slice(-1)]||''}`.trim();
/* samma lag om namnet stämmer och klassen stämmer (eller, utan klass, samma serie) */
const favMatch = (f, t, lid) => f.team===t && (!lid || (f.cls && clsOf(lid) ? f.cls===clsOf(lid) : f.lid===lid));
const isFav = (t, lid) => favs.some(f => favMatch(f, t, lid));
const favKey = f => [f.team, f.cls||'', f.lid||''].join('|');
/* tar bort exakt den raden i Mina lag, oavsett hur favoriten en gång sparades */
function removeFavByKey(k){ const f = favs.find(x=>favKey(x)===k); favs = favs.filter(x=>favKey(x)!==k); saveFavs(); if(f) toast(`${f.team} borttagen från Mina lag`); render(true); }
function migrateFavs(){
  let changed = false;
  favs.forEach(f=>{ if(!f.cls && f.lid){ const c = clsOf(f.lid); if(c){ f.cls = c; changed = true; } } });
  /* två stjärnor för samma lag i olika serier av samma klass blir en */
  const seen = new Set(); const before = favs.length;
  favs = favs.filter(f=>{ const k = f.team+'|'+(f.cls||f.lid); if(seen.has(k)) return false; seen.add(k); return true; });
  if(changed || favs.length!==before) saveFavs();
}
let favSeries = [];
try{ favSeries = JSON.parse(localStorage.getItem('isl-series')||'[]'); }catch(e){}
const isFavSeries = id => favSeries.includes(id);
function toggleFavSeries(id){ favSeries = isFavSeries(id)?favSeries.filter(x=>x!==id):[...favSeries,id]; try{ localStorage.setItem('isl-series',JSON.stringify(favSeries)); }catch(e){} render(true); }
let seriesFilter = {q:'', district:'', age:'', gender:''};
const gameInfo = {};     /* match-ID → matchkortets data */
const gameLeague = {};   /* match-ID → serie-ID, fylls när matchkort visas */
function toggleFav(t, lid){
  lid = lid || '';
  if(isFav(t, lid)){ favs = favs.filter(f => !favMatch(f, t, lid)); toast(`${t} borttagen från Mina lag`); }
  else {
    const cls = clsOf(lid);
    /* en äldre favorit utan serie ersätts av den nya, som vet vilken serie den gäller */
    favs = [...favs.filter(f => !(f.team===t && !f.lid)), {team:t, cls, lid}];
    toast(`★ ${t}${cls?' '+clsLabel(cls):''} följs nu i alla sina serier`);
  }
  saveFavs(); render(true);
}

/* Antal ordinarie perioder: ungdomsserier spelar ofta 2. Swehockey lägger då förlängningen som tredje
   resultat (och händelserna som period 4), så vi lär oss per serie: 2 perioder i ett slutresultat,
   eller förlängning utan period 3 → serien har 2. Händelser i period 3 → 3. */
let leagueReg = {}; try{ leagueReg = JSON.parse(localStorage.getItem('isl-reg')||'{}'); }catch(e){}
function learnReg(lid, r){ if(lid && leagueReg[lid]!==r){ leagueReg[lid]=r; try{ localStorage.setItem('isl-reg', JSON.stringify(leagueReg)); }catch(e){} } }
function learnFromList(list){ (list||[]).forEach(x=>{ if(x.status==='final' && x.periods && x.periods.length===2) learnReg(x.leagueId, 2); }); return list; }
const regOf = x => x.reg || leagueReg[x.leagueId] || (x.periods.length===2 ? 2 : 3);
/* [{lab:'P1'|'ÖT'|'Straff', s:'1-0', reg:true}] – en avslutande 0-0 efter ordinarie tid (ingen förlängning spelad) tas bort */
function periodParts(x){
  const R = regOf(x), p = (x.periods||[]).slice();
  if(p.length===R+1 && p[R][0]===0 && p[R][1]===0 && x.status==='final') p.pop();
  return p.map((q,i)=>({lab: i<R ? 'P'+(i+1) : i===R ? 'ÖT' : 'Straff', s:`${q[0]}-${q[1]}`, reg:i<R}));
}
const perLabel = n => n===4 ? 'Förlängning' : n===5 ? 'Straffläggning' : `Period ${n}`;

function parseHash(){
  const h = location.hash.slice(1);
  if(h.startsWith('game-')) return {view:'game', id:h.slice(5)};
  if(h.startsWith('league-')) return {view:'league', id:h.slice(7)};
  if(['leagues','favs'].includes(h)) return {view:h};
  return {view:'today'};
}
const go = h => { location.hash = h; };
window.addEventListener('hashchange',()=>{ route=parseHash(); render(); window.scrollTo(0,0); });

const SV_DAYS=['sön','mån','tis','ons','tor','fre','lör'];
function dateStrip(){
  const base = new Date(selDate+'T12:00'); let out='';
  for(let i=-3;i<=4;i++){
    const d=new Date(base); d.setDate(d.getDate()+i); const iso=d.toISOString().slice(0,10);
    out+=`<button class="date ${iso===selDate?'on':''}" data-date="${iso}"><small>${SV_DAYS[d.getDay()]}</small><b>${d.getDate()}</b></button>`;
  }
  return `<div class="dates" id="dates">${out}</div>`;
}
function gameCard(x){
  if(x.leagueId) gameLeague[x.id]=x.leagueId;
  gameInfo[x.id]=x;
  const done = x.status!=='upcoming';
  const hw = done && x.hs>x.as, aw = done && x.as>x.hs;
  const right = x.status==='live' ? `<span class="livetag">LIVE</span><span class="per">${x.clock||''}</span>`
    : x.status==='final' ? `<span>Slut</span><span class="per">${periodParts(x).map(p=>p.reg?p.s:`${p.lab} ${p.s}`).join(', ')}</span>`
    : `<span>${route.view==='today'?'':fmtDate(x.date)+' · '}${x.time}</span><span class="per">${x.venue||''}</span>`;
  const fav = isFav(x.home, x.leagueId)||isFav(x.away, x.leagueId);
  return `<button class="game ${x.status==='live'?'live':''}" data-game="${x.id}">
    <div class="team ${aw?'lose':''}">${badge(x.home)}<span class="nm">${x.home}</span></div><div class="score num ${aw?'lose':''}">${done?x.hs:''}</div>
    <div class="team ${hw?'lose':''}">${badge(x.away)}<span class="nm">${x.away}</span></div><div class="score num ${hw?'lose':''}">${done?x.as:''}</div>
    <div class="meta">${fav?'<span style="color:var(--gold)">★</span>':''}${right}${x.stream?'<span class="tv">▶ TV</span>':''}</div></button>`;
}
/* Grupperar dagens matcher per serie. Rubriken är en länk till seriens Idag-sida. */
function groupBySeries(list, cat){
  const m=new Map(); list.forEach(x=>{ const k=x.leagueId||x.league; if(!m.has(k)) m.set(k,[]); m.get(k).push(x); });
  return [...m.entries()].map(([k,arr])=>{
    const meta = cat.find(c=>c.id===k), live=arr.filter(x=>x.status==='live').length;
    const title = meta?meta.name:arr[0].league, d = meta?meta.district:arr[0].district, sub = d&&d!=='Nationell'?shortDistrict(d):'';
    return `<button class="sechead" ${meta?`data-today="${k}"`:''}><span><b>${title}</b>${sub?`<small>${sub}</small>`:''}</span>
      ${live?`<span class="pill" style="color:var(--live)">${live} live</span>`:`<span class="pill">${arr.length}</span>`}${meta?'<span class="chev">›</span>':''}</button>
      <div class="games">${arr.map(gameCard).join('')}</div>`;
  }).join('');
}
/* "SHL (7)"-listan: alla serier som spelar idag, som underlänkar */
function seriesToday(list, cat){
  const m=new Map(); list.forEach(x=>{ const k=x.leagueId||x.league; const e=m.get(k)||{n:0,live:0,first:x}; e.n++; if(x.status==='live') e.live++; m.set(k,e); });
  const rows=[...m.entries()].sort((a,b)=>b[1].live-a[1].live||(isFavSeries(b[0])-isFavSeries(a[0])));
  return `<div class="card todaylist">${rows.map(([k,e])=>{const meta=cat.find(c=>c.id===k);
    return `<button class="trow" ${meta?`data-today="${k}"`:''}>${isFavSeries(k)?'<span style="color:var(--gold)">★</span>':''}
      <span class="tn"><b>${meta?meta.name:e.first.league}</b>${(meta?meta.district:e.first.district)&&(meta?meta.district:e.first.district)!=='Nationell'?`<small>${shortDistrict(meta?meta.district:e.first.district)}</small>`:''}</span>
      ${e.live?`<span class="livetag">${e.live}</span>`:''}<span class="cnt">${e.n}</span><span class="chev">›</span></button>`;}).join('')}</div>`;
}
const empty = (ic,t)=>`<div class="empty"><div class="big">${ic}</div>${t}</div>`;

async function viewLeagues(){

  const districts = [...new Set(cat.map(x=>x.district))].sort((a,b)=>rank(a)-rank(b)||a.localeCompare(b,'sv'));

async function fillSeries(){
  const cat = await catalog(), f = seriesFilter;
  const words = f.q.toLowerCase().split(/\s+/).filter(Boolean);
  const inArea = x => !f.district || x.district===f.district || (/^Region /.test(f.district) && x.region===f.district);
  const hits = cat.filter(x=>inArea(x)&&(!f.age||String(x.age)===String(f.age))&&(!f.gender||x.gender===f.gender)
    && words.every(w=>(x.name+' '+x.district+' '+(x.age?'u'+x.age:'')).toLowerCase().includes(w)));
  const el = document.getElementById('seriesList'); if(!el) return;
  const LIMIT = 80;
  el.innerHTML = hits.length ? hits.slice(0,LIMIT).map(seriesRow).join('') + (hits.length>LIMIT?`<p style="color:var(--dim);font-size:12px;margin:12px 4px">Visar ${LIMIT} av ${hits.length} – förfina sökningen.</p>`:'')
    : empty('🔍','Inga serier matchar');
}

const fmtDate = d => { const x=new Date(d+'T12:00'); return `${SV_DAYS[x.getDay()]} ${x.getDate()} ${['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec'][x.getMonth()]}`; };

/* Seriens schema kan vara några timmar gammalt (förhämtat). Dagens matcher byts mot färska från
   /api/games, som har riktiga match-ID, livestatus och resultat. */
async function withFreshToday(list, lid){
  const today = todaySE();
  if(!API_BASE || !list.some(g=>g.date===today)) return list;
  let fresh = [];
  try{ fresh = (await api.games(today)).filter(g=>!lid || g.leagueId===lid || !g.leagueId); }catch(e){ return list; }
  return list.map(g => g.date!==today ? g : (fresh.find(f=>f.home===g.home && f.away===g.away) || g));
}
/* liveuppdatering: kom ihåg vilka händelser som redan visats per match */
const seenEvents = {};
let lineupTeam = 0, gameTab = 'events', lastGameId = null, lastGameStatus = null, lastUpdated = null;
const evKey = e => `${e.period}|${e.time}|${e.type}|${e.title}`;
async function viewGame(){
  if(route.id!==lastGameId){ gameTab='events'; lastGameId=route.id; }
  /* matcher utan rapport-ID (från serieschemat): leta upp det riktiga ID:t bland dagens matcher */
  if(API_BASE && !/^\d+$/.test(route.id)){
    const info = gameInfo[route.id];
    if(info){
      try{
        const real = (await api.games(info.date)).find(g=>g.home===info.home && g.away===info.away && /^\d+$/.test(g.id));
        if(real){ gameLeague[real.id] = info.leagueId || real.leagueId; history.replaceState(null,'','#game-'+real.id); route = {view:'game', id:real.id}; return viewGame(); }
      }catch(e){}
    }
    header(info?.league || 'Match', true);
    return info
      ? `<div class="hero"><div class="lg">${info.venue||''}</div><div class="row"><div class="side">${badge(info.home,'lg')}${info.home}</div>
          <div class="big num"><span style="font-size:32px;color:var(--muted)">vs</span></div><div class="side">${badge(info.away,'lg')}${info.away}</div></div>
          <div class="status">${fmtDate(info.date)} · ${info.time}</div></div>`
        + empty('⏳','Swehockey har ingen matchrapport för den här matchen än. Den dyker upp här när matchen har startat och rapporteras.')
      : empty('🔎','Matchen hittades inte. Gå tillbaka och öppna den från serien eller förstasidan.');
  }
  const x = await api.game(route.id);
  lastGameStatus = x.status; lastUpdated = new Date();
  const lid = x.leagueId || gameLeague[route.id] || '';
  if(!x.leagueId) x.leagueId = lid;
  { const ps = new Set((x.events||[]).map(e=>e.period));
    if(ps.has(3)) { x.reg=3; learnReg(lid,3); }
    else if(ps.has(4)||ps.has(5)||(x.status==='final'&&x.periods.length===2)) { x.reg=2; learnReg(lid,2); } }
  /* markera nya händelser och meddela nya mål */
  const prev = seenEvents[route.id];
  (x.events||[]).forEach(e=>{ if(prev && !prev.has(evKey(e))){ e.fresh=true; if(e.type==='goal' && API_BASE) toast(`MÅL! ${abbr(e.team)} ${e.score||''} – ${e.title.replace('Mål – ','')}`); } });
  seenEvents[route.id] = new Set((x.events||[]).map(evKey));
  header(x.league, true);
  const done = x.status!=='upcoming';
  const curPer = x.periods.length;
  const status = x.status==='live'?`<span class="livetag">LIVE · ${x.clock||''}</span>`:x.status==='final'?'Slutresultat':`${fmtDate(x.date)} · ${x.time}`;
  const hero = `<div class="hero"><div class="lg">${x.venue||''}${x.spectators?` · ${x.spectators.toLocaleString('sv')} åskådare`:''}</div>
    <div class="row"><div class="side">${badge(x.home,'lg')}${x.home}</div>
    <div class="big num">${done?`${x.hs}<span style="color:var(--dim)">–</span>${x.as}`:'<span style="font-size:32px;color:var(--muted)">vs</span>'}</div>
    <div class="side">${badge(x.away,'lg')}${x.away}</div></div>
    <div class="status">${status}</div>
    ${done?`<div class="pers">${periodParts(x).map((p,i)=>`<span class="${x.status==='live'&&i===curPer-1?'cur':''}">${p.lab} ${p.s}</span>`).join('')}</div>`:''}
    <div style="display:flex;gap:8px;justify-content:center">
      <button class="favbtn" data-fav="${x.home}" data-fav-league="${lid}">${isFav(x.home, lid)?'★':'☆'} ${abbr(x.home)}</button>
      <button class="favbtn" data-fav="${x.away}" data-fav-league="${lid}">${isFav(x.away, lid)?'★':'☆'} ${abbr(x.away)}</button></div>
    ${x.stream?`<a class="watch ${x.stream.live?'live':''}" href="${x.stream.url}" target="_blank" rel="noopener">▶ ${x.stream.live?'Se live':'Se sändningen'} på svenskhockey.tv</a>`:''}</div>`;
  const tabs = `<div class="tabs" style="margin-top:18px">${[['events','Händelser'],['lineup','Laguppställning']].map(([k,t])=>`<button class="${gameTab===k?'on':''}" data-gtab="${k}">${t}</button>`).join('')}</div>`;
  if(gameTab==='lineup') return hero+tabs+await lineupView(x, lid);
  if(!done) return hero+tabs+empty('⏳','Matchen har inte startat. Händelser visas här live när den börjar.');

  const sh=[x.shots.reduce((s,p)=>s+p[0],0), x.shots.reduce((s,p)=>s+p[1],0)];
  const statBar=(lbl,a,b,fmt=v=>v)=>{const t=(a+b)||1;return `<div class="statrow"><div class="lbl"><b class="num" style="font-size:17px">${fmt(a)}</b><span>${lbl}</span><b class="num" style="font-size:17px">${fmt(b)}</b></div>
    <div class="bar"><i style="flex:${a/t};background:${barCol(x.home)}"></i><i style="flex:${b/t};background:${barCol(x.away)}"></i></div></div>`;};
  /* målvakten med flest skott emot per lag (byten förekommer) */
  const gkFor = t => (x.goalies||[]).filter(g=>g.team===t).sort((a,b)=>b.sa-a.sa)[0];
  const svp = gk => gk.sa?((gk.sv/gk.sa)*100).toFixed(1).replace('.',',')+'%':'–';
  const stats = `<h2 class="sec">Statistik</h2><div class="card">
    ${statBar('Skott',sh[0],sh[1])}
    ${statBar('Utvisningsminuter',x.pim[0],x.pim[1])}
    ${gkFor(x.home)||gkFor(x.away)?`<div class="statrow"><div class="lbl"><span>${gkFor(x.home)?`${gkFor(x.home).name} · <b>${svp(gkFor(x.home))}</b>`:'–'}</span><span>Räddn.</span><span>${gkFor(x.away)?`<b>${svp(gkFor(x.away))}</b> · ${gkFor(x.away).name}`:'–'}</span></div></div>`:''}
    </div>`;

  const evIcon={goal:'●',pen:'⏱',gk:'⇄'};
  let tl='', lastP=0;
  [...x.events].sort((a,b)=>b.period-a.period||b.time.localeCompare(a.time)).forEach(e=>{
    if(e.period!==lastP){ tl+=`<div class="perhead">${perLabel(e.period)}</div>`; lastP=e.period; }
    tl+=`<div class="ev ${e.type} ${e.fresh?'new':''}"><div class="tm">${e.time}</div><div class="body"><span class="ico">${evIcon[e.type]||'•'}</span>
      <div><b>${e.title}</b><small>${abbr(e.team)} · ${e.text||''}</small></div>${e.score?`<span class="sc">${e.score}</span>`:''}</div></div>`;
    e.fresh=false;
  });
  const upd = x.status==='live' ? `<span class="pill live-pill">● live · ${lastUpdated.toLocaleTimeString('sv-SE',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}</span>` : '';
  return hero+tabs+stats+`<h2 class="sec">Händelser ${upd}</h2><div class="card tl">${tl||empty('—','Inga händelser än')}</div>`;
}

/* laguppställning – dold för de yngsta åldrarna (barns namn), som poängligan */
async function lineupView(x, lid){
  const meta = lid ? (await catalog()).find(c=>c.id===lid) : null;
  const age = meta?.age || +((x.league||'').match(/\bU(\d{1,2})/)||[])[1] || null;
  if(age && age < MIN_PLAYER_AGE) return empty('🔒','Laguppställningar visas inte för de yngsta åldrarna.');
  let lu; try{ lu = await api.lineup(route.id); }catch(e){ return empty('⚠️','Kunde inte hämta laguppställningen.'); }
  if(lu.demo) return empty('👥','Laguppställningen hämtas från swehockey på den riktiga sajten.');
  if(!lu.available || !lu.teams.length) return empty('👥','Ingen laguppställning är rapporterad för matchen än.');
  if(lineupTeam > 1) lineupTeam = 0;
  const t = lu.teams[lineupTeam];
  const pl = p => `<div class="lp"><span class="no num">${p.no}</span><span>${p.name}</span>${p.pos?`<small>${p.pos}</small>`:''}</div>`;
  const block = (title, list) => list.length ? `<div class="lgrp"><div class="perhead">${title}</div>${list.map(pl).join('')}</div>` : '';
  const line = (l,i) => l.length===5
    ? `<div class="lgrp"><div class="perhead">Femma ${i+1}</div><div class="lsub">Backar</div>${l.slice(0,2).map(pl).join('')}<div class="lsub">Forwards</div>${l.slice(2).map(pl).join('')}</div>`
    : block(`Femma ${i+1}`, l);
  return `<div class="chips" style="margin:2px 0 12px">${lu.teams.map((tm,i)=>`<button class="chip ${i===lineupTeam?'on':''}" data-lteam="${i}">${badge(tm.name)} ${tm.name}</button>`).join('')}</div>
    <div class="card">${block('Målvakter', t.goalies)}${t.lines.map(line).join('')}${block('Extraspelare', t.extra)}
      ${t.coach||t.assistant?`<div class="lgrp"><div class="perhead">Ledare</div>${t.coach?`<div class="lp"><span class="no">HC</span><span>${t.coach}</span></div>`:''}${t.assistant?`<div class="lp"><span class="no">AC</span><span>${t.assistant}</span></div>`:''}</div>`:''}</div>
    ${lu.referees||lu.linesmen?`<p style="color:var(--dim);font-size:12px;margin:12px 4px">Domare: ${lu.referees||'–'}${lu.linesmen?` · Linjedomare: ${lu.linesmen}`:''}</p>`:''}`;
}

const versionLine = () => `<p class="ver">Isläge ${APP_VERSION} · av RostyFrosty</p>`;
const versionWrap = html => html + versionLine();
async function viewFavs(){
  header('Mina lag');
  if(!favs.length) return versionWrap(empty('⭐','Inga favoritlag än.<br><br>Tryck på ☆ vid ett lag på en matchsida eller i en tabell – då samlas lagets matcher här.')
    +`<h2 class="sec">Snabbval</h2><div class="chips" style="flex-wrap:wrap">${Object.keys(TEAMS).slice(0,14).map(t=>`<button class="chip" data-fav="${t}" data-fav-league="${['Leksands IF','MoDo Hockey','AIK','BIK Karlskoga','Södertälje SK','Västerås IK','Kalmar HC','IK Oskarshamn','Mora IK','Almtuna IS','Vimmerby HC','Östersunds IK','Nybro Vikings IF','Visby/Roma HK'].includes(t)?'20962':'20961'}">${abbr(t)}</button>`).join('')}</div>`);
  const cat = await catalog();
  const teamIdx = await teamIndex();
  /* dagens matcher fångar nya serier som ännu inte finns i lagregistret */
  const today = API_BASE ? await api.games(todaySE()).catch(()=>[]) : [];
  /* serier per favoritlag: lagregistret + serien där laget stjärnmärktes + dagens matcher, alla i samma klass */
  const seriesFor = f => {
    const ids = new Set();
    (teamIdx[f.team]||[]).forEach(id=>{ if(!f.cls || clsOf(id)===f.cls) ids.add(id); });
    if(f.lid) ids.add(f.lid);
    today.forEach(g=>{ if((g.home===f.team||g.away===f.team) && g.leagueId && (!f.cls || clsOf(g.leagueId)===f.cls)) ids.add(g.leagueId); });
    return [...ids];
  };
  const favSer = favs.map(seriesFor);
  /* hämta varje serie en gång, även om flera favoritlag spelar i den */
  const lids = [...new Set(favSer.flat())];
  const perLeague = {};
  await Promise.all(lids.map(async id=>{ const lg = cat.find(c=>c.id===id) || {id, name:''}; perLeague[id] = await withFreshToday(await api.leagueGames(lg).catch(()=>[]) || [], id); }));
  const fallback = favs.some(f=>!f.lid && !favSer[favs.indexOf(f)].length) ? await api.allGames() : [];
  const ageOf = f => f.cls && !f.cls.startsWith('S-') ? parseInt(f.cls) : 99;
  const sorted = favs.map((f,i)=>({...f, ser:favSer[i]})).sort((a,b)=>a.team.localeCompare(b.team,'sv') || ageOf(a)-ageOf(b));
  return versionWrap(sorted.map(({team:t, lid, cls, ser})=>{
    const pool = ser.length ? ser.flatMap(id=>(perLeague[id]||[]).map(x=>({...x, leagueId:x.leagueId||id}))) : fallback;
    /* dagens matcher (färsk status) ovanpå seriernas scheman */
    today.forEach(x=>{ if(x.leagueId && ser.includes(x.leagueId)) pool.push(x); });
    const byId = new Map(); pool.filter(x=>x.home===t||x.away===t).forEach(x=>{
      /* samma match kan ha tillfälligt ID i schemat och riktigt ID i dagens lista */
      const k = x.date===todaySE() ? `${x.date}|${x.home}|${x.away}` : x.id;
      if(!byId.has(k) || x.date===todaySE() && /^\d+$/.test(x.id)) byId.set(k, x); });
    const gl = [...byId.values()].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
    const live = gl.filter(x=>x.status==='live'), upcoming = gl.filter(x=>x.status==='upcoming').slice(0,3), recent = gl.filter(x=>x.status==='final').slice(-3).reverse();
    const key = t+'|'+(cls||lid||''), open = openFavs.has(key), nxt = upcoming[0];
    const status = live.length ? '<span class="livetag">LIVE</span>' : nxt ? `<span class="fnext">${fmtDate(nxt.date)} ${nxt.time||''}</span>` : '';
    const metas = ser.map(id=>cat.find(c=>c.id===id)).filter(Boolean);
    const d = metas.find(m=>m.district && m.district!=='Nationell')?.district;
    const sub = [clsLabel(cls), metas.length>1 ? `${metas.length} serier` : metas[0]?.name, d?shortDistrict(d):''].filter(Boolean).join(' · ');
    const serChips = metas.length ? `<div class="chips" style="margin:0 0 8px">${metas.map(m=>`<button class="chip" data-league="${m.id}">${m.name} ›</button>`).join('')}</div>` : '';
    return `<div class="favhead ${open?'open':''}" data-favopen="${key.replace(/"/g,'&quot;')}">${badge(t)}<span class="fn"><b>${t}</b>${sub?`<small>${sub}</small>`:''}</span>
        ${status}<span class="fchev">›</span></div>
      <div class="favgames" ${open?'':'hidden'}>${serChips}<div style="display:flex;gap:8px;justify-content:flex-end;margin:0 4px 8px"><button class="pill" data-favdel="${favKey({team:t,cls,lid}).replace(/"/g,'&quot;')}">Ta bort</button></div>
      <div class="games">${[...live,...upcoming,...recent].map(gameCard).join('')||empty('🗓️',ser.length?'Inga matcher hittade':'Öppna en match med laget och stjärnmärk igen, så kopplas laget till sin serie')}</div></div>`;
  }).join(''));
}

/* =========================================================
   RENDER
   ========================================================= */
const app = document.getElementById('app');
let renderToken=0, afterRender=null;
async function render(silent){
  const tok=++renderToken; afterRender=null;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',
    b.dataset.go===route.view || (b.dataset.go==='leagues'&&route.view==='league') || (b.dataset.go==='today'&&route.view==='game')));
  try{
    await catalog();   /* favoriter jämförs per åldersklass, som kommer från katalogen */
    const html = await ({today:viewToday,leagues:viewLeagues,league:viewLeague,game:viewGame,favs:viewFavs}[route.view]||viewToday)();
    if(tok!==renderToken) return;
    if(route.view==='leagues' && silent && document.getElementById('q')){ /* behåll sökfältets fokus */
      const focused = document.activeElement && document.activeElement.id==='q';
      app.innerHTML = html; if(afterRender) afterRender(); if(focused){ const q=document.getElementById('q'); q.focus(); q.setSelectionRange(q.value.length,q.value.length); } return; }
    app.innerHTML = silent?html:`<div class="fade">${html}</div>`;
    if(afterRender) afterRender();
  }catch(err){
    app.innerHTML = empty('⚠️','Kunde inte hämta data. Försök igen om en stund.');
  }
}
app.addEventListener('click',e=>{
  const t=e.target.closest('[data-favdel],[data-tfilter],[data-favopen],[data-gtab],[data-lteam],[data-today],[data-favseries],[data-game],[data-league],[data-ltab],[data-filter],[data-fav],[data-age],[data-gender]'); if(!t) return;
  if(t.dataset.favdel!==undefined){ e.stopPropagation(); removeFavByKey(t.dataset.favdel); return; }
  if(t.dataset.tfilter!==undefined){ const n=t.dataset.tfilter; if(!n) teamFilter.clear(); else teamFilter.has(n)?teamFilter.delete(n):teamFilter.add(n); render(true); return; }
  if(t.dataset.favopen!==undefined){ const k=t.dataset.favopen, open=!openFavs.has(k); open?openFavs.add(k):openFavs.delete(k);
    t.classList.toggle('open',open); const g=t.nextElementSibling; if(g) g.hidden=!open; return; }
  if(t.dataset.gtab){ gameTab=t.dataset.gtab; render(true); return; }
  if(t.dataset.lteam!==undefined){ lineupTeam=+t.dataset.lteam; render(true); return; }
  if(t.dataset.today){ leagueTab='today'; go('league-'+t.dataset.today); return; }
  if(t.dataset.favseries){ e.stopPropagation(); toggleFavSeries(t.dataset.favseries); return; }
  if(t.dataset.age!==undefined){ seriesFilter.age=t.dataset.age; document.querySelectorAll('[data-age]').forEach(b=>b.classList.toggle('on',b===t)); fillSeries(); return; }
  if(t.dataset.gender!==undefined){ seriesFilter.gender=t.dataset.gender; document.querySelectorAll('[data-gender]').forEach(b=>b.classList.toggle('on',b===t)); fillSeries(); return; }
  if(t.dataset.fav){ e.stopPropagation(); toggleFav(t.dataset.fav, t.dataset.favLeague); return; }
  if(t.dataset.game) go('game-'+t.dataset.game);
  else if(t.dataset.league){ leagueTab='today'; go('league-'+t.dataset.league); }
  else if(t.dataset.ltab){ leagueTab=t.dataset.ltab; render(true); }
  else if(t.dataset.filter){ leagueFilter=t.dataset.filter; render(true); }
});
let toastT; function toast(m){ const el=document.getElementById('toast'); el.textContent=m; el.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),2500); }

route = parseHash(); render();
/* PWA: registrera service worker när sidan körs från egen domän (inte i förhandsvisningar) */
if('serviceWorker' in navigator && location.protocol==='https:'){
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(()=>{});
  /* ny version installerad → ladda om en gång så att den syns direkt */
  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(hadController && !window.__reloaded){ window.__reloaded=true; location.reload(); } });
}
if(!API_BASE) setInterval(simTick,1000);
else setInterval(()=>{
  if(document.hidden) return;                                   /* spara batteri när appen ligger i bakgrunden */
  if(route.view==='game' && gameTab==='events' && lastGameStatus==='live') render(true);
  else if(route.view==='today' && selDate===todaySE()) render(true);
}, LIVE_POLL_MS);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && route.view==='game' && lastGameStatus==='live') render(true); });
</script>
